# NSS answers a sustained crawl with HTTP 403 every few hours, even at
# 2 req/s, and lifts it within minutes (24.–25. 10. 2026). Decided 25. 10.:
# 1 req/s, and after a 403 (exit 3) resume by itself in 60 min from the
# cursor — at most 4 starts in 24 h (the first and 3 resumes); after that the
# unit stays failed until a human looks.
[Unit]
StartLimitIntervalSec=24h
StartLimitBurst=4

[Service]
RestartPreventExitStatus=
Restart=on-failure
RestartSec=60min
