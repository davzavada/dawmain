# NSS answers a sustained crawl with HTTP 403 every 1–2.5 hours, even at
# 1 req/s, and lifts it within minutes (24.–25. 10. 2026) — a volume limit,
# not a rate one. Decided 25. 10.: 1 req/s, and after a 403 (exit 3) resume
# by itself in 60 min from the cursor; 26. 10.: without a daily cap — the
# unit keeps cycling (work until 403, an hour's pause) until the backfill ends.
# 27. 10.: the 403s fall exactly on 30-minute marks from a run's start (a quota
# per 30-minute window), so the pause is 30 min; the pace went up to 2 req/s, 2 at once (~3,100 decisions/h, no 403), then to 4 req/s, 4 at once.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartPreventExitStatus=
Restart=on-failure
RestartSec=30min
